name: Build CRK Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack CRK Android source
        run: unzip -q CRK_Android_Studio_Project_v1.1.1_BETA.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test CRK bridge
        working-directory: CRK_Android_Project
        run: node tests/bridge.test.cjs
      - name: Build debug APK
        working-directory: CRK_Android_Project
        run: sed -i '298s@ui.post(()->@String savedName=safe;ui.post(()->@;298s@+safe,Toast@+savedName,Toast@' app/src/main/java/com/crk/rawkeeper/MainActivity.java && gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRK-Android-APK
          path: CRK_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
