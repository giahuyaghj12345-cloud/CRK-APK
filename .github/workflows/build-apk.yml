name: Build CRK Standalone APK (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack standalone Android source
        run: unzip -q -o CRK_Standalone_Auto_Source_v1.2_BETA.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check CRK JavaScript bridge
        working-directory: CRK_Standalone_Auto_Android_Project
        run: node tests/bridge.test.cjs
      - name: Build standalone Android debug APK
        working-directory: CRK_Standalone_Auto_Android_Project
        run: gradle --no-daemon assembleDebug
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: CRK-Standalone-Auto-UI-APK
          path: CRK_Standalone_Auto_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
